[package]
name = "fprettier"
version = "0.4.0"
edition = "2021"
# Floor set by unsigned is_multiple_of, stabilized in 1.87 and used by the
# indent alignment check. Verified with `cargo +1.87.0 check --all-targets`.
rust-version = "1.87"
authors = ["Fred Jones"]
description = "Auto-formatter for modern Fortran source code"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fredjones42/fprettier"
readme = "README.md"
keywords = ["fortran", "formatter", "cli", "code-formatting", "pretty-print"]
categories = ["command-line-utilities", "development-tools"]

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
too_many_lines = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
struct_excessive_bools = "allow"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["string"] }
glob = "0.3"
regex = "1.12"
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
similar = "2"
toml = "0.9"
walkdir = "2.5"
mimalloc = { version = "0.1", default-features = false }

